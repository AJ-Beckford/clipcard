<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Contact Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      padding: 20px;
    }

    /* Entrance Animation */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 3D Perspective Container */
    .card-container {
      width: 340px;
      height: 440px;
      perspective: 1000px;
      animation: fadeSlideUp 0.8s ease-out forwards;
    }

    /* Inner Flip Wrapper */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    /* Trigger Flip on Hover or Focus */
    .card-container:hover .card-inner,
    .card-container:focus-within .card-inner {
      transform: rotateY(180deg);
    }

    /* Shared Front & Back Styles */
    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Front Card Styling */
    .card-front {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      color: #f8fafc;
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #38bdf8;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.4s ease;
    }

    .card-container:hover .avatar {
      transform: scale(1.05);
    }

    .name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .role {
      font-size: 0.95rem;
      color: #38bdf8;
      font-weight: 500;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .bio {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .hint {
      font-size: 0.8rem;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* Back Card Styling */
    .card-back {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      color: #f8fafc;
      transform: rotateY(180deg);
      align-items: stretch;
    }

    .card-back h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
      color: #38bdf8;
    }

    .contact-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .contact-list li {
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .contact-list li:hover {
      transform: translateX(6px);
      background: rgba(56, 189, 248, 0.15);
    }

    .contact-list span {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .contact-list a {
      color: #f8fafc;
      text-decoration: none;
      font-weight: 500;
    }

    .cta-btn {
      display: block;
      text-align: center;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .cta-btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="card-container" tabindex="0">
    <div class="card-inner">
      
      <!-- Front of Card -->
      <div class="card-front">
        <img 
          src="https://unsplash.com" 
          alt="Profile Picture" 
          class="avatar"
        />
        <h1 class="name">Alex Rivera</h1>
        <p class="role">Product Designer & Developer</p>
        <p class="bio">Building clean, accessible web interfaces and interactive digital experiences.</p>
        <span class="hint">Hover or tap to view contact info</span>
      </div>

      <!-- Back of Card -->
      <div class="card-back">
        <h2>Get in Touch</h2>
        <ul class="contact-list">
          <li>
            <span>Email</span>
            <a href="mailto:alex@example.com">alex@example.com</a>
          </li>
          <li>
            <span>Phone</span>
            <a href="tel:+14165550199">+1 (416) 555-0199</a>
          </li>
          <li>
            <span>Location</span>
            <strong>Toronto, ON</strong>
          </li>
          <li>
            <span>Portfolio</span>
            <a href="https://example.com" target="_blank" rel="noopener">alexrivera.dev</a>
          </li>
        </ul>
        <a href="mailto:alex@example.com" class="cta-btn">Send Message</a>
      </div>

    </div>
  </div>

</body>
</html>
